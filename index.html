<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睡眠・生活リズム記録</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#253344;margin:0;padding:10px}main{max-width:1200px;margin:auto}section{background:white;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 5px #ddd}h1{font-size:20px;margin:12px 0}h2{font-size:17px}label{display:flex;flex-direction:column;gap:5px;font-size:13px}input,button{font:inherit;padding:9px;border:1px solid #bcc9d8;border-radius:7px;min-width:0;width:100%}button{background:#365e92;color:white;border:0;cursor:pointer}button:active{opacity:.7}.scroll{overflow-x:auto;overflow-y:hidden;border:1px solid #ddd;overscroll-behavior-x:contain}table{border-collapse:separate;border-spacing:0;font-size:9px;width:max-content}th,td{border-right:1px solid #d6dee6;border-bottom:1px solid #d6dee6;text-align:center;min-width:27px;width:27px;height:clamp(9px,calc((100dvh - 180px)/48),14px);line-height:1;padding:0}thead th{position:sticky;top:0;background:#edf3fa;z-index:4;height:25px}th:first-child{position:sticky;left:0;background:#edf3fa;z-index:3;min-width:43px;width:43px}thead th:first-child{z-index:5}td.sleep{background:#aeb4bc}.mark{font-size:11px;font-weight:bold;white-space:nowrap}.sunmark{color:#db8b00}.drowsymark{color:#375ca2}.medmark{font-size:10px}.legend{font-size:12px;margin:9px 0;display:flex;gap:12px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.date-field{grid-column:1/-1}.row2 input[type=date],.row3 input[type=date]{padding:7px;font-size:12px;margin:3px 0}.form-grid label{min-width:0}.row2{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.point-list{display:flex;flex-direction:column;gap:5px}.point-item{display:flex;gap:4px}.point-item input{flex:1}.point-item button{width:32px;flex:none;background:#8b6774;padding:4px}.point-item .stamp{width:34px;background:#e8eff9;color:#284d7d}.time-wrap{display:flex;gap:4px;align-items:center}.time-wrap input{flex:1;min-width:0}.time-wrap button{width:36px;flex:none;padding:8px 3px;background:#e8eff9;color:#284d7d}.row3 .point-item{gap:2px}.row3 .point-item button{width:27px}.row3 .point-item input{padding:6px 2px;font-size:12px}.row3 .add{padding:6px 2px}.add{background:#e8eff9;color:#284d7d;font-size:12px;padding:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{width:auto;flex:1;min-width:120px}#status{font-size:13px;font-weight:600;white-space:pre-wrap}small{color:#586574;font-size:11px}@media print{body{padding:0;background:white}section{box-shadow:none}#form{display:none}.scroll{overflow:visible}td,th{height:10px;min-width:18px}}
#form .form-grid{display:flex;flex-direction:column;gap:14px}#form .date-field{display:flex;flex-direction:column;gap:8px;max-width:none}#form .date-field>label{display:block;width:100%;max-width:none}#form .date-field>label input[type=date]{max-width:240px}#form .date-field>label .time-wrap{max-width:240px}#form .date-field .point-list{width:100%}#form .date-field:nth-child(2),#form .date-field:nth-child(3){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:10px}#form .date-field:nth-child(2) label input[type=date],#form .date-field:nth-child(3) label input[type=date]{width:100%}#form .date-field:nth-child(2) .time-wrap,#form .date-field:nth-child(3) .time-wrap{max-width:none}@media(max-width:380px){#form .date-field:nth-child(2),#form .date-field:nth-child(3){gap:6px}}
.delete-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.delete-grid input{font-size:14px}.danger{background:#ad3d48}.delete-help{font-size:13px;color:#586574;line-height:1.6}#deleteStatus{font-size:13px;white-space:pre-wrap}@media(max-width:450px){.delete-grid{grid-template-columns:1fr}}@media print{#delete-section{display:none}}</style></head><body><main><h1>🌙 睡眠・生活リズム記録</h1><section><label style="max-width:200px">表示する月<input id="month" type="month"></label><div class="legend"><span>■ グレー：睡眠</span><span>☀️：日光</span><span>💤：眠気</span><span>💊：服薬</span></div><div class="scroll"><table id="grid"></table></div></section><section id="form"><h2>記録を入力</h2><div class="form-grid">
<div class="date-field"><label>💊 服薬（就寝日を自動使用）<div class="time-wrap"><input id="med1" type="time"><button type="button" class="stamp" data-target="med1" title="現在時刻を入力">⏱</button></div></label><details style="margin-top:8px"><summary style="font-size:13px">追加の服薬時刻（任意）</summary><label style="margin-top:8px;max-width:220px">💊 薬②<div class="time-wrap"><input id="med2" type="time"><button type="button" class="stamp" data-target="med2" title="現在時刻を入力">⏱</button></div></label></details></div>
<div class="date-field"><label>🌙 就寝日<input id="bedDate" type="date"></label><label>就寝時間<div class="time-wrap"><input id="bed" type="time"><button type="button" class="stamp" data-target="bed" title="現在日時を入力">⏱</button></div></label></div>
<div class="date-field"><label>🌅 起床日<input id="wakeDate" type="date"></label><label>起床時間<div class="time-wrap"><input id="wake" type="time"><button type="button" class="stamp" data-target="wake" title="現在日時を入力">⏱</button></div></label></div>
<div class="date-field"><label>☀️ 日光（起床日を自動使用）</label><div id="suns" class="point-list"></div><button class="add" type="button" id="addsun">＋追加</button></div>
<div class="date-field"><label>💤 眠気（起床日を自動使用）</label><div id="drowsies" class="point-list"></div><button class="add" type="button" id="adddrowsy">＋追加</button></div>
</div>

<div class="actions"><button type="button" id="save">記録を保存して表に反映</button><button type="button" id="backup">JSONバックアップ</button><button type="button" id="importButton">JSONを読み込む</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p id="status" role="status"></p></section><section id="delete-section"><h2>🗑️ 削除：〇時〜〇時</h2><div class="delete-grid"><label>開始日時<input type="datetime-local" id="deleteStart"></label><label>終了日時<input type="datetime-local" id="deleteEnd"></label></div><button type="button" id="deleteRange" class="danger">指定範囲の記録を削除</button><p id="deleteStatus" role="status"></p></section></main><script>
(function(){'use strict';
function el(id){return document.getElementById(id)}function pad(n){return String(n).padStart(2,'0')}function dayString(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dateObj(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}function minutes(s){if(!s)return null;var p=s.split(':').map(Number);return p[0]*60+p[1]}function status(s){el('status').textContent=s}
var KEY='sleep-rhythm-monthly-v2',records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){records={}}var today=dayString(new Date());el('month').value=today.slice(0,7);el('bedDate').value=today;el('wakeDate').value=today;
function nowTime(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())}document.querySelectorAll('[data-target]').forEach(function(btn){btn.onclick=function(){el(btn.getAttribute('data-target')).value=nowTime();if(btn.getAttribute('data-target')==='bed')el('bedDate').value=dayString(new Date());if(btn.getAttribute('data-target')==='wake')el('wakeDate').value=dayString(new Date());status('現在時刻を入力しました。保存ボタンで表に反映してください。')}});function pointRow(id,value){var row=document.createElement('div');row.className='point-item';var input=document.createElement('input');input.type='time';input.value=value||'';input.setAttribute('aria-label',id==='suns'?'日光を浴びた時間':'眠気が来た時間');var del=document.createElement('button');del.type='button';del.textContent='×';del.onclick=function(){row.remove()};var stamp=document.createElement('button');stamp.type='button';stamp.className='stamp';stamp.textContent='⏱';stamp.title='現在時刻を入力';stamp.onclick=function(){input.value=nowTime();status('現在時刻を入力しました。保存ボタンで表に反映してください。')};row.append(input,stamp,del);el(id).append(row)}function fillPoints(id,arr){el(id).textContent='';(arr&&arr.length?arr:['']).forEach(function(v){pointRow(id,typeof v==='string'?v:(v.start||''))})}function collect(id){return Array.from(el(id).querySelectorAll('input')).map(function(x){return x.value}).filter(Boolean)}el('addsun').onclick=function(){pointRow('suns','')};el('adddrowsy').onclick=function(){pointRow('drowsies','')};fillPoints('suns',[]);fillPoints('drowsies',[]);
function instant(day,time){return dateObj(day).getTime()+minutes(time)*60000}
function render(){var month=el('month').value;if(!month)return;var parts=month.split('-').map(Number),year=parts[0],mon=parts[1],days=new Date(year,mon,0).getDate(),grid=el('grid');grid.textContent='';var head=document.createElement('thead'),hr=document.createElement('tr'),h=document.createElement('th');h.textContent='時刻';hr.append(h);for(var d=1;d<=days;d++){h=document.createElement('th');h.textContent=d;h.onclick=(function(day){return function(){load(day)}})(year+'-'+pad(mon)+'-'+pad(d));hr.append(h)}head.append(hr);grid.append(head);var body=document.createElement('tbody'),ranges=[],events=[];
Object.keys(records).forEach(function(key){var r=records[key]||{},bedDay=r.bedDate||key,wakeDay=r.wakeDate||key;if(r.bed&&r.wake){var a=instant(bedDay,r.bed),b=instant(wakeDay,r.wake);if(b>a)ranges.push({start:a,end:b,excluded:r.excluded||[]})}function addEvent(day,t,type){if(day&&t)events.push({at:instant(day,t),type:type})}(r.sun||[]).forEach(function(x){addEvent(wakeDay,typeof x==='string'?x:x.start,'sun')});(r.drowsy||[]).forEach(function(x){addEvent(wakeDay,typeof x==='string'?x:x.start,'drowsy')});addEvent(bedDay,r.med1||r.med,'med');addEvent(bedDay,r.med2,'med')});
for(var slot=0;slot<48;slot++){var tr=document.createElement('tr'),time=document.createElement('th');time.textContent=pad(Math.floor(slot/2))+':'+(slot%2?'30':'00');tr.append(time);for(var dd=1;dd<=days;dd++){var ds=year+'-'+pad(mon)+'-'+pad(dd),start=dateObj(ds).getTime()+slot*1800000,end=start+1800000,cell=document.createElement('td'),marks=[];for(var k=0;k<ranges.length;k++){if(ranges[k].start<end&&ranges[k].end>start&&!ranges[k].excluded.some(function(x){return x[0]<end&&x[1]>start})){cell.className='sleep';break}}for(var j=0;j<events.length;j++){if(events[j].at>=start&&events[j].at<end){var type=events[j].type;marks.push(type==='sun'?'☀️':type==='drowsy'?'💤':'💊')}}if(marks.length){var span=document.createElement('span');span.className='mark';span.textContent=marks.join('');cell.append(span)}cell.onclick=(function(day){return function(){load(day)}})(ds);tr.append(cell)}body.append(tr)}grid.append(body)}
function load(day){var r=records[day]||{};el('bedDate').value=r.bedDate||day;el('wakeDate').value=r.wakeDate||day;el('bed').value=r.bed||'';el('wake').value=r.wake||'';el('med1').value=r.med1||r.med||'';el('med2').value=r.med2||'';fillPoints('suns',r.sun||[]);fillPoints('drowsies',r.drowsy||[]);status(records[day]?'登録済みの記録を読み込みました。':'就寝日を選択しました。');el('form').scrollIntoView({block:'start'})}
el('bedDate').onchange=function(){var key=el('bedDate').value;if(records[key])load(key)};
el('save').onclick=function(){try{var bedDay=el('bedDate').value,wakeDay=el('wakeDate').value,bed=el('bed').value,wake=el('wake').value,med1=el('med1').value,med2=el('med2').value;if(!bedDay||!wakeDay)throw Error('就寝日と起床日を入力してください');if(Boolean(bed)!==Boolean(wake))throw Error('就寝と起床の時刻を両方入力してください');if(bed&&instant(wakeDay,wake)<=instant(bedDay,bed))throw Error('起床日時は就寝日時より後にしてください');var sun=collect('suns'),drowsy=collect('drowsies');if(!bed&&!med1&&!med2&&!sun.length&&!drowsy.length)throw Error('記録を1つ以上入力してください');records[bedDay]={bedDate:bedDay,wakeDate:wakeDay,bed:bed,wake:wake,med1:med1,med2:med2,sun:sun,drowsy:drowsy,excluded:(records[bedDay]&&records[bedDay].excluded)||[]};var saved=true;try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){saved=false}el('month').value=bedDay.slice(0,7);render();status('✓ 表に反映しました。薬：'+bedDay+'／日光・眠気：'+wakeDay+'。'+(saved?' 自動保存済み。':' ※ブラウザに保存できません。JSONバックアップをご利用ください。'))}catch(e){status('⚠ '+e.message)}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){return false}}
function fmtLocal(ms){var d=new Date(ms);return dayString(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
(function(){var now=new Date(),a=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0),b=new Date(a.getTime()+3600000);el('deleteStart').value=fmtLocal(a.getTime());el('deleteEnd').value=fmtLocal(b.getTime())})();
el('deleteRange').onclick=function(){var msg=el('deleteStatus');try{var sv=el('deleteStart').value,ev=el('deleteEnd').value;if(!sv||!ev)throw Error('開始日時と終了日時を入力してください。');var a=new Date(sv).getTime(),b=new Date(ev).getTime();if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)throw Error('終了日時は開始日時より後にしてください。');var affected=0;Object.keys(records).forEach(function(key){var r=records[key],bd=r.bedDate||key,wd=r.wakeDate||key,changed=false;
if(r.bed&&r.wake){var x=instant(bd,r.bed),y=instant(wd,r.wake);if(x<b&&y>a){r.excluded=r.excluded||[];r.excluded.push([Math.max(a,x),Math.min(b,y)]);changed=true}}
function keepTimes(field,day){var arr=r[field]||[],filtered=arr.filter(function(t){var v=typeof t==='string'?t:t.start;var at=instant(day,v);return !(at>=a&&at<b)});if(filtered.length!==arr.length){r[field]=filtered;changed=true}}
keepTimes('sun',wd);keepTimes('drowsy',wd);
['med1','med2','med'].forEach(function(field){if(r[field]){var at=instant(bd,r[field]);if(at>=a&&at<b){r[field]='';changed=true}}});if(changed)affected++});
if(!affected){msg.textContent='指定範囲に削除対象の記録はありません。';return}var ok=persist();el('month').value=sv.slice(0,7);render();msg.textContent='✓ 指定範囲の記録を削除し、表を更新しました。'+(ok?' 保存済み。':' ⚠ ブラウザ保存に失敗しました。JSONバックアップをご利用ください。');status('削除範囲を表に反映しました。');
}catch(e){msg.textContent='⚠ '+e.message}};
el('importButton').onclick=function(){el('importFile').click()};
el('importFile').onchange=function(){
 var file=this.files&&this.files[0];this.value='';if(!file)return;
 if(file.size>5000000){status('⚠ ファイルが大きすぎます（上限5MB）。');return}
 var reader=new FileReader();reader.onerror=function(){status('⚠ JSONファイルを読み込めませんでした。')};
 reader.onload=function(){
  try{
   var parsed=JSON.parse(reader.result);
   if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('記録データの形式が違います。');
   var keys=Object.keys(parsed),datePattern=/^\d{4}-\d{2}-\d{2}$/;
   if(keys.some(function(key){return !datePattern.test(key)||!parsed[key]||typeof parsed[key]!=='object'||Array.isArray(parsed[key])}))throw Error('このアプリのバックアップ形式ではありません。');
   if(keys.some(function(key){var r=parsed[key];return ['sun','drowsy','excluded'].some(function(f){return r[f]!==undefined&&!Array.isArray(r[f])})}))throw Error('記録の配列形式が不正です。');
   if(!confirm('JSONから'+keys.length+'日分の記録を復元します。\n現在の記録はすべて置き換わります。先にJSONバックアップを保存しましたか？')){status('読み込みをキャンセルしました。');return}
   var old=records;records=parsed;
   if(!persist()){records=old;throw Error('ブラウザへの保存に失敗しました。既存データは変更していません。')}
   render();status('✓ '+keys.length+'日分の記録を復元し、表に反映しました。');
  }catch(e){status('⚠ JSONインポート失敗：'+e.message)}
 };
 reader.readAsText(file);
};
el('month').onchange=render;el('backup').onclick=function(){var blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='睡眠記録.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},2000)};try{render()}catch(e){status('表示エラー: '+e.message)}
})();</script></body></html>
